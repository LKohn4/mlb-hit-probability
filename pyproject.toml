[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-hit-probability"
version = "0.2.0"
description = "Predict MLB hit probability from Statcast batted-ball data with random forests and neural networks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leo Kohn" }]
keywords = ["baseball", "mlb", "statcast", "machine-learning", "sabermetrics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.0"]

[project.scripts]
hit-probability = "hit_probability.cli:main"

[project.urls]
Repository = "https://github.com/LKohn4/mlb-hit-probability"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hit_probability"]
